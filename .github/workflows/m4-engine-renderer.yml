name: Milestone 4B Engine Renderer and Title Boundary

on:
  push:
    branches:
      - "agent/**"
    paths:
      - "SOURCE_PIN.env"
      - "DEPENDENCY_TRIAL_PINS.env"
      - "MOLTENVK_PIN.env"
      - "overlays/gzselaco-ios/i_runtime_bootstrap.mm"
      - "overlays/gzselaco-ios/i_swapchain_probe.mm"
      - "overlays/gzselaco-ios/i_engine_startup_stubs.mm"
      - "overlays/gzselaco-ios/i_engine_init_probe.mm"
      - "overlays/gzselaco-ios/i_engine_renderer_handoff.mm"
      - "scripts/patch-gzselaco-ios-m0.py"
      - "scripts/patch-gzselaco-vulkan-only-ios-m0.py"
      - "scripts/patch-gzselaco-runtime-bootstrap-ios-m1.py"
      - "scripts/patch-gzselaco-swapchain-ios-m2.py"
      - "scripts/patch-gzselaco-local-asset-ios-m3.py"
      - "scripts/run-m3-local-asset-patcher.py"
      - "scripts/patch-gzselaco-engine-init-ios-m4.py"
      - "scripts/patch-gzselaco-engine-renderer-ios-m4b.py"
      - "scripts/patch-gzselaco-runtime-handoff-ios-m4b.py"
      - "scripts/patch-gzselaco-title-menu-ios-m4b.py"
      - "scripts/patch-zvulkan-engine-renderer-ios-m4b.py"
      - "scripts/m0-full-engine-configure-probe.sh"
      - "scripts/m0-full-engine-compile-probe.sh"
      - "scripts/m0-full-engine-app-artifact-probe.sh"
      - "scripts/m0-controlled-mktemp.sh"
      - "scripts/m4-engine-init-compile-probe.sh"
      - "scripts/m4-engine-init-app-artifact-probe.sh"
      - "scripts/m4-engine-renderer-compile-probe.sh"
      - "scripts/m4-engine-renderer-app-artifact-probe.sh"
      - ".github/workflows/m4-engine-renderer.yml"
  pull_request:
    paths:
      - "overlays/gzselaco-ios/i_engine_renderer_handoff.mm"
      - "scripts/patch-gzselaco-engine-renderer-ios-m4b.py"
      - "scripts/patch-gzselaco-runtime-handoff-ios-m4b.py"
      - "scripts/patch-gzselaco-title-menu-ios-m4b.py"
      - "scripts/patch-zvulkan-engine-renderer-ios-m4b.py"
      - "scripts/m4-engine-renderer-compile-probe.sh"
      - "scripts/m4-engine-renderer-app-artifact-probe.sh"
      - ".github/workflows/m4-engine-renderer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-engine-renderer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-iphoneos-engine-renderer:
    name: full-engine Vulkan handoff and title/menu candidate
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out SelacoiOS
        uses: actions/checkout@v4

      - name: Validate Milestone 4B inputs
        run: |
          bash -n scripts/m0-full-engine-configure-probe.sh
          bash -n scripts/m0-full-engine-compile-probe.sh
          bash -n scripts/m0-full-engine-app-artifact-probe.sh
          bash -n scripts/m0-controlled-mktemp.sh
          bash -n scripts/m4-engine-init-compile-probe.sh
          bash -n scripts/m4-engine-init-app-artifact-probe.sh
          bash -n scripts/m4-engine-renderer-compile-probe.sh
          bash -n scripts/m4-engine-renderer-app-artifact-probe.sh
          python3 -m py_compile scripts/patch-gzselaco-ios-m0.py
          python3 -m py_compile scripts/patch-gzselaco-vulkan-only-ios-m0.py
          python3 -m py_compile scripts/patch-gzselaco-runtime-bootstrap-ios-m1.py
          python3 -m py_compile scripts/patch-gzselaco-swapchain-ios-m2.py
          python3 -m py_compile scripts/patch-gzselaco-local-asset-ios-m3.py
          python3 -m py_compile scripts/run-m3-local-asset-patcher.py
          python3 -m py_compile scripts/patch-gzselaco-engine-init-ios-m4.py
          python3 -m py_compile scripts/patch-gzselaco-engine-renderer-ios-m4b.py
          python3 -m py_compile scripts/patch-gzselaco-runtime-handoff-ios-m4b.py
          python3 -m py_compile scripts/patch-gzselaco-title-menu-ios-m4b.py
          python3 -m py_compile scripts/patch-zvulkan-engine-renderer-ios-m4b.py
          test -s overlays/gzselaco-ios/i_engine_renderer_handoff.mm
          command -v unzip
          command -v shasum

      - name: Build and validate M4B renderer candidate
        run: |
          real_mktemp="$(command -v mktemp)"
          shim_dir="${GITHUB_WORKSPACE}/build/m4-engine-renderer-shims"
          controlled_root="${GITHUB_WORKSPACE}/build/work/m4-engine-renderer-app/tmp"
          mkdir -p "${shim_dir}" "${controlled_root}"
          cp scripts/m0-controlled-mktemp.sh "${shim_dir}/mktemp"
          chmod +x "${shim_dir}/mktemp"
          export SELACOIOS_REAL_MKTEMP="${real_mktemp}"
          export SELACOIOS_CONTROLLED_TMP_ROOT="${controlled_root}"
          export PATH="${shim_dir}:${PATH}"
          bash scripts/m4-engine-renderer-app-artifact-probe.sh

      - name: Record workflow identity
        if: always()
        run: |
          mkdir -p build/evidence/m4-engine-renderer-app
          {
            echo "tested_head=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "stable_bundle_identifier=am.arjunkl.selacoios.engineinit.m4"
            echo "stable_files_container=SelacoiOS Engine Init"
            echo "job_id_available_after_run=true"
          } > build/evidence/m4-engine-renderer-app/workflow-identity.txt

      - name: Preserve engine renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m4b-engine-renderer-evidence
          path: build/evidence/m4-engine-renderer-app
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve updated Engine Init app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m4b-engine-renderer-unsigned-app
          path: build/artifacts/m4-engine-renderer-app/Selaco-engine-init-probe-unsigned-app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Preserve updated Engine Init IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m4b-engine-renderer-unsigned-ipa
          path: build/artifacts/m4-engine-renderer-app/Selaco-engine-init-probe-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
