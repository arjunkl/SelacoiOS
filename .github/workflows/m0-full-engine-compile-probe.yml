name: Milestone 0 Full Engine iOS Compile Boundary

on:
  push:
    branches:
      - "agent/**"
    paths:
      - "SOURCE_PIN.env"
      - "DEPENDENCY_TRIAL_PINS.env"
      - "MOLTENVK_PIN.env"
      - "cmake/host-tools/**"
      - "overlays/gzselaco-ios/**"
      - "overlays/zmusic-ios/**"
      - "probes/libvpx-decoder-contract.cpp"
      - "scripts/patch-gzselaco-ios-m0.py"
      - "scripts/patch-gzselaco-vulkan-only-ios-m0.py"
      - "scripts/patch-zmusic-ios-m0.py"
      - "scripts/m0-libvpx-ios-probe.sh"
      - "scripts/m0-full-engine-configure-probe.sh"
      - "scripts/m0-full-engine-compile-probe.sh"
      - ".github/workflows/m0-full-engine-compile-probe.yml"
  pull_request:
    paths:
      - "SOURCE_PIN.env"
      - "DEPENDENCY_TRIAL_PINS.env"
      - "MOLTENVK_PIN.env"
      - "cmake/host-tools/**"
      - "overlays/gzselaco-ios/**"
      - "overlays/zmusic-ios/**"
      - "probes/libvpx-decoder-contract.cpp"
      - "scripts/patch-gzselaco-ios-m0.py"
      - "scripts/patch-gzselaco-vulkan-only-ios-m0.py"
      - "scripts/patch-zmusic-ios-m0.py"
      - "scripts/m0-libvpx-ios-probe.sh"
      - "scripts/m0-full-engine-configure-probe.sh"
      - "scripts/m0-full-engine-compile-probe.sh"
      - ".github/workflows/m0-full-engine-compile-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-full-engine-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-iphoneos-full-compile:
    name: first full-engine arm64 iPhoneOS compile boundary
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out SelacoiOS
        uses: actions/checkout@v4

      - name: Validate compile probe inputs
        run: |
          bash -n scripts/m0-full-engine-configure-probe.sh
          bash -n scripts/m0-full-engine-compile-probe.sh
          bash -n scripts/m0-libvpx-ios-probe.sh
          python3 -m py_compile scripts/patch-gzselaco-ios-m0.py
          python3 -m py_compile scripts/patch-gzselaco-vulkan-only-ios-m0.py
          python3 -m py_compile scripts/patch-zmusic-ios-m0.py

      - name: Compile until the first classified source boundary
        run: bash scripts/m0-full-engine-compile-probe.sh

      - name: Preserve full-engine compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m0-full-engine-compile-evidence
          path: build/evidence/m0-full-engine-compile
          if-no-files-found: warn
          retention-days: 14
