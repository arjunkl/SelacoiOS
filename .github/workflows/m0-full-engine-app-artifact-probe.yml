name: Milestone 0 Full Engine App Artifact

on:
  push:
    branches:
      - "agent/**"
    paths:
      - "SOURCE_PIN.env"
      - "DEPENDENCY_TRIAL_PINS.env"
      - "MOLTENVK_PIN.env"
      - "cmake/host-tools/**"
      - "overlays/gzselaco-ios/**"
      - "overlays/zmusic-ios/**"
      - "probes/libvpx-decoder-contract.cpp"
      - "scripts/patch-gzselaco-ios-m0.py"
      - "scripts/patch-gzselaco-vulkan-only-ios-m0.py"
      - "scripts/patch-zmusic-ios-m0.py"
      - "scripts/m0-libvpx-ios-probe.sh"
      - "scripts/m0-full-engine-configure-probe.sh"
      - "scripts/m0-full-engine-compile-probe.sh"
      - "scripts/m0-full-engine-app-artifact-probe.sh"
      - "scripts/m0-controlled-mktemp.sh"
      - ".github/workflows/m0-full-engine-app-artifact-probe.yml"
  pull_request:
    paths:
      - "SOURCE_PIN.env"
      - "DEPENDENCY_TRIAL_PINS.env"
      - "MOLTENVK_PIN.env"
      - "cmake/host-tools/**"
      - "overlays/gzselaco-ios/**"
      - "overlays/zmusic-ios/**"
      - "probes/libvpx-decoder-contract.cpp"
      - "scripts/patch-gzselaco-ios-m0.py"
      - "scripts/patch-gzselaco-vulkan-only-ios-m0.py"
      - "scripts/patch-zmusic-ios-m0.py"
      - "scripts/m0-libvpx-ios-probe.sh"
      - "scripts/m0-full-engine-configure-probe.sh"
      - "scripts/m0-full-engine-compile-probe.sh"
      - "scripts/m0-full-engine-app-artifact-probe.sh"
      - "scripts/m0-controlled-mktemp.sh"
      - ".github/workflows/m0-full-engine-app-artifact-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-full-engine-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-iphoneos-full-app:
    name: unsigned full-engine arm64 iPhoneOS app
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out SelacoiOS
        uses: actions/checkout@v4

      - name: Validate app probe inputs
        run: |
          bash -n scripts/m0-full-engine-app-artifact-probe.sh
          bash -n scripts/m0-full-engine-compile-probe.sh
          bash -n scripts/m0-full-engine-configure-probe.sh
          bash -n scripts/m0-controlled-mktemp.sh
          python3 -m py_compile scripts/patch-gzselaco-ios-m0.py
          python3 -m py_compile scripts/patch-gzselaco-vulkan-only-ios-m0.py
          python3 -m py_compile scripts/patch-zmusic-ios-m0.py
          test -s overlays/gzselaco-ios/i_platform_runtime.mm

      - name: Build, preserve, and validate full-engine app
        run: |
          real_mktemp="$(command -v mktemp)"
          shim_dir="${GITHUB_WORKSPACE}/build/m0-full-engine-app-shims"
          controlled_root="${GITHUB_WORKSPACE}/build/work/m0-full-engine-app/tmp"
          mkdir -p "${shim_dir}" "${controlled_root}"
          cp scripts/m0-controlled-mktemp.sh "${shim_dir}/mktemp"
          chmod +x "${shim_dir}/mktemp"
          export SELACOIOS_REAL_MKTEMP="${real_mktemp}"
          export SELACOIOS_CONTROLLED_TMP_ROOT="${controlled_root}"
          export PATH="${shim_dir}:${PATH}"
          bash scripts/m0-full-engine-app-artifact-probe.sh

      - name: Preserve full-engine app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m0-full-engine-app-evidence
          path: build/evidence/m0-full-engine-app
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve unsigned full-engine app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m0-full-engine-unsigned-app
          path: build/artifacts/m0-full-engine-app/Selaco-full-engine-unsigned-app.zip
          if-no-files-found: error
          retention-days: 14
