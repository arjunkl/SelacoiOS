name: Milestone 3 Local Asset Recognition

on:
  push:
    branches:
      - "agent/**"
    paths:
      - "SOURCE_PIN.env"
      - "DEPENDENCY_TRIAL_PINS.env"
      - "MOLTENVK_PIN.env"
      - "overlays/gzselaco-ios/i_runtime_bootstrap.mm"
      - "overlays/gzselaco-ios/i_swapchain_probe.mm"
      - "overlays/gzselaco-ios/i_engine_startup_stubs.mm"
      - "scripts/patch-gzselaco-ios-m0.py"
      - "scripts/patch-gzselaco-vulkan-only-ios-m0.py"
      - "scripts/patch-gzselaco-runtime-bootstrap-ios-m1.py"
      - "scripts/patch-gzselaco-swapchain-ios-m2.py"
      - "scripts/patch-gzselaco-local-asset-ios-m3.py"
      - "scripts/run-m3-local-asset-patcher.py"
      - "scripts/m0-full-engine-configure-probe.sh"
      - "scripts/m0-full-engine-compile-probe.sh"
      - "scripts/m0-full-engine-app-artifact-probe.sh"
      - "scripts/m0-controlled-mktemp.sh"
      - "scripts/m3-local-asset-compile-probe.sh"
      - "scripts/m3-local-asset-app-artifact-probe.sh"
      - ".github/workflows/m3-local-asset-recognition.yml"
  pull_request:
    paths:
      - "SOURCE_PIN.env"
      - "DEPENDENCY_TRIAL_PINS.env"
      - "MOLTENVK_PIN.env"
      - "overlays/gzselaco-ios/i_runtime_bootstrap.mm"
      - "overlays/gzselaco-ios/i_swapchain_probe.mm"
      - "overlays/gzselaco-ios/i_engine_startup_stubs.mm"
      - "scripts/patch-gzselaco-ios-m0.py"
      - "scripts/patch-gzselaco-vulkan-only-ios-m0.py"
      - "scripts/patch-gzselaco-runtime-bootstrap-ios-m1.py"
      - "scripts/patch-gzselaco-swapchain-ios-m2.py"
      - "scripts/patch-gzselaco-local-asset-ios-m3.py"
      - "scripts/run-m3-local-asset-patcher.py"
      - "scripts/m0-full-engine-configure-probe.sh"
      - "scripts/m0-full-engine-compile-probe.sh"
      - "scripts/m0-full-engine-app-artifact-probe.sh"
      - "scripts/m0-controlled-mktemp.sh"
      - "scripts/m3-local-asset-compile-probe.sh"
      - "scripts/m3-local-asset-app-artifact-probe.sh"
      - ".github/workflows/m3-local-asset-recognition.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-local-asset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-iphoneos-local-asset:
    name: full-engine local licensed-asset recognition app
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - name: Check out SelacoiOS
        uses: actions/checkout@v4

      - name: Validate Milestone 3 inputs
        run: |
          bash -n scripts/m0-full-engine-configure-probe.sh
          bash -n scripts/m0-full-engine-compile-probe.sh
          bash -n scripts/m0-full-engine-app-artifact-probe.sh
          bash -n scripts/m0-controlled-mktemp.sh
          bash -n scripts/m3-local-asset-compile-probe.sh
          bash -n scripts/m3-local-asset-app-artifact-probe.sh
          python3 -m py_compile scripts/patch-gzselaco-ios-m0.py
          python3 -m py_compile scripts/patch-gzselaco-vulkan-only-ios-m0.py
          python3 -m py_compile scripts/patch-gzselaco-runtime-bootstrap-ios-m1.py
          python3 -m py_compile scripts/patch-gzselaco-swapchain-ios-m2.py
          python3 -m py_compile scripts/patch-gzselaco-local-asset-ios-m3.py
          python3 -m py_compile scripts/run-m3-local-asset-patcher.py
          test -s overlays/gzselaco-ios/i_engine_startup_stubs.mm
          command -v unzip
          command -v shasum

      - name: Build and validate local asset recognition app
        run: |
          real_mktemp="$(command -v mktemp)"
          shim_dir="${GITHUB_WORKSPACE}/build/m3-local-asset-shims"
          controlled_root="${GITHUB_WORKSPACE}/build/work/m3-local-asset-app/tmp"
          mkdir -p "${shim_dir}" "${controlled_root}"
          cp scripts/m0-controlled-mktemp.sh "${shim_dir}/mktemp"
          chmod +x "${shim_dir}/mktemp"
          export SELACOIOS_REAL_MKTEMP="${real_mktemp}"
          export SELACOIOS_CONTROLLED_TMP_ROOT="${controlled_root}"
          export PATH="${shim_dir}:${PATH}"
          bash scripts/m3-local-asset-app-artifact-probe.sh

      - name: Preserve local asset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m3-local-asset-recognition-evidence
          path: build/evidence/m3-local-asset-app
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve unsigned local asset app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m3-local-asset-recognition-unsigned-app
          path: build/artifacts/m3-local-asset-app/Selaco-local-asset-probe-unsigned-app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Preserve unsigned local asset IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m3-local-asset-recognition-unsigned-ipa
          path: build/artifacts/m3-local-asset-app/Selaco-local-asset-probe-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
