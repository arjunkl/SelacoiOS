name: Milestone 1 Runtime Bootstrap App

on:
  push:
    branches:
      - "agent/**"
    paths:
      - "SOURCE_PIN.env"
      - "DEPENDENCY_TRIAL_PINS.env"
      - "MOLTENVK_PIN.env"
      - "cmake/host-tools/**"
      - "overlays/gzselaco-ios/**"
      - "overlays/zmusic-ios/**"
      - "probes/libvpx-decoder-contract.cpp"
      - "scripts/patch-gzselaco-ios-m0.py"
      - "scripts/patch-gzselaco-vulkan-only-ios-m0.py"
      - "scripts/patch-gzselaco-runtime-bootstrap-ios-m1.py"
      - "scripts/patch-zmusic-ios-m0.py"
      - "scripts/m0-libvpx-ios-probe.sh"
      - "scripts/m0-full-engine-configure-probe.sh"
      - "scripts/m0-full-engine-compile-probe.sh"
      - "scripts/m0-full-engine-app-artifact-probe.sh"
      - "scripts/m0-controlled-mktemp.sh"
      - "scripts/m1-runtime-bootstrap-compile-probe.sh"
      - "scripts/m1-runtime-bootstrap-app-artifact-probe.sh"
      - ".github/workflows/m1-runtime-bootstrap-app.yml"
  pull_request:
    paths:
      - "SOURCE_PIN.env"
      - "DEPENDENCY_TRIAL_PINS.env"
      - "MOLTENVK_PIN.env"
      - "cmake/host-tools/**"
      - "overlays/gzselaco-ios/**"
      - "overlays/zmusic-ios/**"
      - "probes/libvpx-decoder-contract.cpp"
      - "scripts/patch-gzselaco-ios-m0.py"
      - "scripts/patch-gzselaco-vulkan-only-ios-m0.py"
      - "scripts/patch-gzselaco-runtime-bootstrap-ios-m1.py"
      - "scripts/patch-zmusic-ios-m0.py"
      - "scripts/m0-libvpx-ios-probe.sh"
      - "scripts/m0-full-engine-configure-probe.sh"
      - "scripts/m0-full-engine-compile-probe.sh"
      - "scripts/m0-full-engine-app-artifact-probe.sh"
      - "scripts/m0-controlled-mktemp.sh"
      - "scripts/m1-runtime-bootstrap-compile-probe.sh"
      - "scripts/m1-runtime-bootstrap-app-artifact-probe.sh"
      - ".github/workflows/m1-runtime-bootstrap-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-runtime-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-iphoneos-runtime-bootstrap:
    name: full-engine UIKit Vulkan runtime bootstrap
    runs-on: macos-15
    timeout-minutes: 95
    steps:
      - name: Check out SelacoiOS
        uses: actions/checkout@v4

      - name: Validate runtime bootstrap inputs
        run: |
          bash -n scripts/m0-full-engine-configure-probe.sh
          bash -n scripts/m0-full-engine-compile-probe.sh
          bash -n scripts/m0-full-engine-app-artifact-probe.sh
          bash -n scripts/m0-controlled-mktemp.sh
          bash -n scripts/m1-runtime-bootstrap-compile-probe.sh
          bash -n scripts/m1-runtime-bootstrap-app-artifact-probe.sh
          python3 -m py_compile scripts/patch-gzselaco-ios-m0.py
          python3 -m py_compile scripts/patch-gzselaco-vulkan-only-ios-m0.py
          python3 -m py_compile scripts/patch-gzselaco-runtime-bootstrap-ios-m1.py
          python3 -m py_compile scripts/patch-zmusic-ios-m0.py
          command -v unzip
          test -s overlays/gzselaco-ios/i_runtime_bootstrap.mm

      - name: Build and validate runtime bootstrap app
        run: |
          real_mktemp="$(command -v mktemp)"
          shim_dir="${GITHUB_WORKSPACE}/build/m1-runtime-bootstrap-shims"
          controlled_root="${GITHUB_WORKSPACE}/build/work/m1-runtime-bootstrap-app/tmp"
          mkdir -p "${shim_dir}" "${controlled_root}"
          cp scripts/m0-controlled-mktemp.sh "${shim_dir}/mktemp"
          chmod +x "${shim_dir}/mktemp"
          export SELACOIOS_REAL_MKTEMP="${real_mktemp}"
          export SELACOIOS_CONTROLLED_TMP_ROOT="${controlled_root}"
          export PATH="${shim_dir}:${PATH}"
          bash scripts/m1-runtime-bootstrap-app-artifact-probe.sh

      - name: Preserve runtime bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m1-runtime-bootstrap-evidence
          path: build/evidence/m1-runtime-bootstrap-app
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve unsigned runtime bootstrap app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m1-runtime-bootstrap-unsigned-app
          path: build/artifacts/m1-runtime-bootstrap-app/Selaco-runtime-bootstrap-unsigned-app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Preserve unsigned runtime bootstrap IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selaco-m1-runtime-bootstrap-unsigned-ipa
          path: build/artifacts/m1-runtime-bootstrap-app/Selaco-runtime-bootstrap-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
